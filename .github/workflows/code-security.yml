name: Code security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: code-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (Python and JavaScript)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned scanner
        run: python -m pip install semgrep==1.180.0
      # Runs locally on the runner: no account, source upload or Code Security
      # entitlement. ERROR-level findings and scanner/config errors fail CI.
      - name: Scan first-party source
        run: >-
          semgrep scan --config p/ci --metrics=off --disable-version-check
          --error --strict --severity ERROR --json --output semgrep-results.json
          --exclude tests --exclude static/lib --exclude static/fonts
          --exclude website/assets --exclude assets --exclude licenses
          .
      - name: Retain security findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: error
          retention-days: 14
